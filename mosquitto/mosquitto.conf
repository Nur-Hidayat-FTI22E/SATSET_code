# ── Mosquitto Configuration for SATSET ───────────────────
persistence true
persistence_location /mosquitto/data/

# Standard MQTT listener
listener 1883
protocol mqtt

# WebSocket listener (for browser/Grafana plugins)
listener 9001
protocol websockets

# Allow anonymous connections (dev environment)
allow_anonymous true

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

---
- name: SATSET Ansible Inventory
  hosts: localhost
  connection: local

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
      satset_compose_dir: "{{ playbook_dir }}/../.."
      satset_services:
        - satset-mosquitto
        - satset-influxdb
        - satset-grafana

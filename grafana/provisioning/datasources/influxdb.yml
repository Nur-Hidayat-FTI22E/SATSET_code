apiVersion: 1

datasources:
  - name: InfluxDB-SATSET
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: satset-lab
      defaultBucket: satset
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
    editable: true
    isDefault: true
